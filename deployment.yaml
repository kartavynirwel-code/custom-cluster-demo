apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-info-frontend
  labels:
    app: pod-info-frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: pod-info-frontend
  template:
    metadata:
      labels:
        app: pod-info-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pod-info-frontend
      containers:
        - name: web
          image: kartavyanirwel/pod-info-frontend:v1
          ports:
            - containerPort: 80
          env:
            - name: APP_TITLE
              value: "Pod Info Frontend"
            - name: APP_ENV
              value: "kubeadm-cluster"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pod-info-frontend
spec:
  type: NodePort
  selector:
    app: pod-info-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
